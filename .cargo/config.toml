# Workspace build settings that every checkout needs.
#
# aarch64 off Apple: candle's matmul backend (`gemm-f16`) carries inline
# AArch64 assembly (`fmul ... .8h`) that LLVM only accepts with the `fp16`
# (FEAT_FP16, ARMv8.2-A) target feature. Apple targets enable it by default;
# `aarch64-pc-windows-msvc` does not, and the crate fails to compile there
# ("instruction requires: fullfp16"). Enabling the feature for that triple
# fixes the build and commits the arm64 Windows binaries to ARMv8.2+
# hardware — every machine that meets the 32 GB model floor (Snapdragon X)
# does.
[target.aarch64-pc-windows-msvc]
rustflags = ["-C", "target-feature=+fp16", "-C", "link-arg=/STACK:16777216"]

# Windows reserves 1 MiB for the main thread (PE /STACK) where macOS
# gives it 8 MiB. The daemon's startup poll chain runs inline on the main
# thread (`runtime.block_on(serve(base))`), and when the store ran on turso,
# open replayed the WAL on that thread and overflowed the reserve (issue
# #23). The store now runs on SQLite on blocking-pool threads and needs
# under 64 KiB, so that cause is gone; the flag stays until a Windows run
# without it proves nothing else on the main thread needs it (plan T6). It
# lifts the main thread to 16 MiB; Rust's std and tokio threads request their
# own explicit sizes, so other threads are unaffected.
[target.x86_64-pc-windows-msvc]
rustflags = ["-C", "link-arg=/STACK:16777216"]

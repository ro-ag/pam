name: CI

on:
  push:
    branches: [main]
    paths-ignore:
      - "**/*.md"
      - "docs/**"
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, labeled]
    paths-ignore:
      - "**/*.md"
      - "docs/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  foundation:
    name: Foundation
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      has_cargo: ${{ steps.rust_workspace.outputs.has_cargo }}
      has_frontend: ${{ steps.frontend.outputs.has_frontend }}
      has_prototype: ${{ steps.prototype.outputs.has_prototype }}
      rust_changed: ${{ steps.rust_changes.outputs.changed }}
    steps:
      - name: Check out repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 2

      - name: Validate repository foundation
        shell: bash
        run: |
          set -euo pipefail
          required=(
            LICENSE
            README.md
            docs/product-brief.md
            docs/research.md
            docs/architecture.md
            docs/stack.md
            docs/roadmap.md
          )
          for path in "${required[@]}"; do
            test -s "$path"
          done
          empty_tree="$(git hash-object -t tree /dev/null)"
          git diff --check "$empty_tree" HEAD

      - name: Detect Rust workspace
        id: rust_workspace
        shell: bash
        run: |
          if [[ -f Cargo.toml ]]; then
            echo "has_cargo=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_cargo=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Detect Rust changes
        id: rust_changes
        shell: bash
        env:
          BEFORE_SHA: ${{ github.event.before }}
        run: |
          set -euo pipefail
          changed=false
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            changed=true
          elif [[ -z "$BEFORE_SHA" || "$BEFORE_SHA" =~ ^0+$ ]] \
            || ! git cat-file -e "$BEFORE_SHA^{commit}"; then
            changed=true
          else
            while IFS= read -r path; do
              case "$path" in
                Cargo.toml|Cargo.lock|rust-toolchain.toml|crates/*|.github/workflows/ci.yml)
                  changed=true
                  break
                  ;;
              esac
            done < <(git diff --name-only "$BEFORE_SHA" "$GITHUB_SHA")
          fi
          echo "changed=$changed" >> "$GITHUB_OUTPUT"

      - name: Detect interactive prototype
        id: prototype
        shell: bash
        run: |
          if [[ -f prototype/package-lock.json ]]; then
            echo "has_prototype=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_prototype=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Detect desktop frontend
        id: frontend
        shell: bash
        run: |
          if [[ -f frontend/package-lock.json ]]; then
            echo "has_frontend=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_frontend=false" >> "$GITHUB_OUTPUT"
          fi

  rust:
    name: Rust
    needs: foundation
    if: ${{ needs.foundation.outputs.has_cargo == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Install Linux desktop dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf xdg-utils

      - name: Install Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1
        with:
          components: rustfmt, clippy

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@49a0bdc70d2e1b713ca9e2869b211fcce03d3c1c # v2

      - name: Stage development PAM helper
        shell: bash
        run: |
          set -euo pipefail
          cargo build -p pam_cli --bin pam --locked
          mkdir -p src-tauri/binaries
          cp target/debug/pam src-tauri/binaries/pam-x86_64-unknown-linux-gnu

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Check workspace
        run: cargo check --workspace --all-targets --all-features --locked

      - name: Lint workspace
        run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings

      - name: Test workspace
        run: cargo test --workspace --all-features --locked

  frontend:
    name: Desktop frontend
    needs: foundation
    if: ${{ needs.foundation.outputs.has_frontend == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Check out repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Install Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci --prefer-offline --no-audit --no-fund

      - name: Check types
        run: npm run typecheck

      - name: Test frontend
        run: npm test

      - name: Build frontend
        run: npm run build

  desktop-packages:
    name: ${{ matrix.name }}
    needs: [rust, frontend]
    if: ${{ github.event_name == 'pull_request' || github.ref == 'refs/heads/main' }}
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux amd64 package
            runner: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            bundles: appimage,deb
            family: linux
            artifact: PAM-linux-amd64
          - name: Linux arm64 package
            runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            bundles: appimage,deb
            family: linux
            artifact: PAM-linux-arm64
          - name: Windows amd64 package
            runner: windows-2025
            target: x86_64-pc-windows-msvc
            bundles: nsis
            family: windows
            artifact: PAM-windows-amd64
          - name: Windows arm64 package
            runner: windows-11-arm
            target: aarch64-pc-windows-msvc
            bundles: nsis
            family: windows
            artifact: PAM-windows-arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Check out repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Install Linux desktop dependencies
        if: ${{ matrix.family == 'linux' }}
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf xdg-utils

      - name: Install Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1
        with:
          target: ${{ matrix.target }}

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@49a0bdc70d2e1b713ca9e2869b211fcce03d3c1c # v2
        with:
          shared-key: desktop-${{ matrix.target }}

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci --prefer-offline --no-audit --no-fund

      - name: Stage PAM helper
        run: node tools/stage-desktop-sidecar.mjs ${{ matrix.target }}

      - name: Build desktop packages
        run: npm --prefix frontend run tauri -- build --target ${{ matrix.target }} --bundles ${{ matrix.bundles }}

      - name: Verify package output
        id: package
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
          FAMILY: ${{ matrix.family }}
        run: |
          set -euo pipefail
          bundle="target/$TARGET/release/bundle"
          if [[ "$FAMILY" == linux ]]; then
            find "$bundle/appimage" -maxdepth 1 -type f -name '*.AppImage' -print -quit | grep -q .
            find "$bundle/deb" -maxdepth 1 -type f -name '*.deb' -print -quit | grep -q .
          else
            find "$bundle/nsis" -maxdepth 1 -type f -name '*.exe' -print -quit | grep -q .
          fi
          echo "path=$bundle" >> "$GITHUB_OUTPUT"

      - name: Upload preview packages
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ steps.package.outputs.path }}
          if-no-files-found: error
          retention-days: 7

  macos-package:
    name: macOS arm64 signed package
    needs: [rust, frontend]
    if: >-
      github.ref == 'refs/heads/main' ||
      (github.event_name == 'pull_request' && contains(github.event.pull_request.labels.*.name, 'run-macos'))
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - name: Check out repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Install Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1
        with:
          target: aarch64-apple-darwin

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@49a0bdc70d2e1b713ca9e2869b211fcce03d3c1c # v2
        with:
          shared-key: desktop-aarch64-apple-darwin

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci --prefer-offline --no-audit --no-fund

      - name: Prepare Apple signing and notarization
        shell: bash
        env:
          APPLE_API_KEY_ID_SECRET: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_KEY_MATERIAL: ${{ secrets.APPLE_API_KEY }}
          APPLE_CERTIFICATE_BASE64_SECRET: ${{ secrets.APPLE_CERTIFICATE_BASE64 }}
          APPLE_CERTIFICATE_PASSWORD_SECRET: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          KEYCHAIN_PASSWORD_SECRET: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          set -euo pipefail
          keychain="$RUNNER_TEMP/pam-build.keychain-db"
          certificate="$RUNNER_TEMP/pam-certificate.p12"
          private_key="$RUNNER_TEMP/AuthKey_${APPLE_API_KEY_ID_SECRET}.p8"
          printf '%s' "$APPLE_CERTIFICATE_BASE64_SECRET" | base64 --decode > "$certificate"
          printf '%s' "$APPLE_API_KEY_MATERIAL" > "$private_key"
          security create-keychain -p "$KEYCHAIN_PASSWORD_SECRET" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD_SECRET" "$keychain"
          security import "$certificate" -k "$keychain" -P "$APPLE_CERTIFICATE_PASSWORD_SECRET" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD_SECRET" "$keychain" >/dev/null
          security list-keychains -d user -s "$keychain"
          identity="$(security find-identity -v -p codesigning "$keychain" | awk -F'"' '/Developer ID Application/ { print $2; exit }')"
          [[ -n "$identity" ]]
          echo "APPLE_SIGNING_IDENTITY=$identity" >> "$GITHUB_ENV"
          echo "APPLE_API_KEY_PATH=$private_key" >> "$GITHUB_ENV"
          echo "PAM_BUILD_KEYCHAIN=$keychain" >> "$GITHUB_ENV"

      - name: Stage PAM helper
        run: node tools/stage-desktop-sidecar.mjs aarch64-apple-darwin

      - name: Build signed and notarized application
        env:
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY_ID }}
          MACOSX_DEPLOYMENT_TARGET: "12.0"
        run: npm --prefix frontend run tauri -- build --target aarch64-apple-darwin --bundles app

      - name: Build, sign, and notarize disk image
        shell: bash
        env:
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY_ID }}
        run: |
          set -euo pipefail
          app="target/aarch64-apple-darwin/release/bundle/macos/PAM.app"
          dmg_dir="target/aarch64-apple-darwin/release/bundle/dmg"
          dmg="$(tools/package-macos-dmg.sh "$PWD/$app" "$PWD/$dmg_dir")"
          codesign --force --timestamp --sign "$APPLE_SIGNING_IDENTITY" "$dmg"
          xcrun notarytool submit "$dmg" \
            --key "$APPLE_API_KEY_PATH" \
            --key-id "$APPLE_API_KEY" \
            --issuer "$APPLE_API_ISSUER" \
            --wait --timeout 20m
          xcrun stapler staple "$dmg"
          xcrun stapler validate "$dmg"

      - name: Verify macOS package contract
        id: package
        shell: bash
        run: |
          set -euo pipefail
          bundle="target/aarch64-apple-darwin/release/bundle"
          app="$bundle/macos/PAM.app"
          dmg="$(find "$bundle/dmg" -maxdepth 1 -type f -name '*.dmg' -print -quit)"
          [[ -n "$dmg" ]]
          codesign --verify --deep --strict "$app"
          codesign --verify --strict "$dmg"
          xcrun stapler validate "$app"
          xcrun stapler validate "$dmg"
          spctl --assess --type execute "$app"
          for binary in "$app/Contents/MacOS/pam" "$app/Contents/MacOS/pam-gui"; do
            [[ "$(lipo -archs "$binary")" == arm64 ]]
            [[ "$(otool -l "$binary" | awk '/cmd LC_BUILD_VERSION/ { seen=1 } seen && /minos/ { print $2; exit }')" == 12.0 ]]
          done
          echo "path=$bundle" >> "$GITHUB_OUTPUT"

      - name: Upload signed preview package
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: PAM-macos-arm64
          path: ${{ steps.package.outputs.path }}
          if-no-files-found: error
          retention-days: 7

      - name: Remove temporary signing material
        if: ${{ always() }}
        shell: bash
        run: |
          if [[ -n "${PAM_BUILD_KEYCHAIN:-}" ]]; then
            security delete-keychain "$PAM_BUILD_KEYCHAIN" || true
          fi
          rm -f "$RUNNER_TEMP/pam-certificate.p12" "$RUNNER_TEMP"/AuthKey_*.p8

  prototype:
    name: Interactive prototype
    needs: foundation
    if: ${{ needs.foundation.outputs.has_prototype == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: prototype
    steps:
      - name: Check out repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Install Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: prototype/package-lock.json

      - name: Install dependencies
        run: npm ci --prefer-offline --no-audit --no-fund

      - name: Build prototype
        run: npm run build

      - name: Test Sites package
        run: npm run test:sites

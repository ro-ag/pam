[workspace]
resolver = "3"
members = ["crates/pam", "crates/pam_daemon", "crates/pam_proto", "crates/pam_store"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
repository = "https://github.com/ro-ag/pam"

[workspace.dependencies]
pam_daemon = { path = "crates/pam_daemon" }
pam_proto = { path = "crates/pam_proto" }
pam_store = { path = "crates/pam_store" }

serde = { version = "1", features = ["derive"] }
serde_json = "1"
# default features off: `mimalloc` bundles C, and the point of turso is a
# pure-Rust engine. pure-rust-crypto keeps aegis pure Rust on every platform.
# Known residue: turso_core links simsimd (small C SIMD kernel for vector
# functions) unconditionally; no feature removes it as of 0.7.
turso = { version = "0.7", default-features = false, features = ["pure-rust-crypto"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time"] }
# pure-Rust ZeroMQ (zmq.rs) — NEVER the `zmq` crate (libzmq C bindings).
# Only the tokio runtime and ipc transport; async-std/async-dispatcher off.
zeromq = { version = "0.6", default-features = false, features = ["tokio-runtime", "ipc-transport"] }
thiserror = "2"
tempfile = "3"

[workspace.lints.rust]
unsafe_code = "deny"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"

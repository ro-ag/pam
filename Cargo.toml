[workspace]
resolver = "3"
members = [
    "crates/pam",
    "crates/pam_client",
    "crates/pam_daemon",
    "crates/pam_gui",
    "crates/pam_model",
    "crates/pam_proto",
    "crates/pam_store",
    "crates/pam_testkit",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
repository = "https://github.com/ro-ag/pam"

[workspace.dependencies]
pam_client = { path = "crates/pam_client" }
pam_daemon = { path = "crates/pam_daemon" }
pam_gui = { path = "crates/pam_gui" }
pam_model = { path = "crates/pam_model" }
pam_proto = { path = "crates/pam_proto" }
pam_store = { path = "crates/pam_store" }
# test-only harness; never published (dev-dependency cycles are fine —
# path-only dev-deps are stripped at publish time).
pam_testkit = { path = "crates/pam_testkit" }

serde = { version = "1", features = ["derive"] }
serde_json = "1"
# default features off: `mimalloc` bundles C, and the point of turso is a
# pure-Rust engine. pure-rust-crypto keeps aegis pure Rust on every platform.
# Known residue: turso_core links simsimd (small C SIMD kernel for vector
# functions) unconditionally; no feature removes it as of 0.7.
turso = { version = "0.7", default-features = false, features = ["pure-rust-crypto"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time"] }
# pure-Rust ZeroMQ (zmq.rs) — NEVER the `zmq` crate (libzmq C bindings).
# Only the tokio runtime and ipc transport; async-std/async-dispatcher off.
zeromq = { version = "0.6", default-features = false, features = ["tokio-runtime", "ipc-transport"] }
thiserror = "2"
tempfile = "3"
# CLI surface: derive-style argument parsing. Pure Rust (clap_builder,
# anstyle, proc-macro derive) — no C compile step.
clap = { version = "4", features = ["derive"] }
# Request ids (`req_<ulid>`). Pure Rust; randomness via getrandom (syscall
# bindings, no C compile step).
ulid = "1"
# process inspection for advisory caller identity; default features off keeps
# the optional `multithread` (rayon) machinery out — only the `system`
# component (processes) is needed. Pure Rust over libc/windows-sys FFI, no C
# compile step.
sysinfo = { version = "0.39", default-features = false, features = ["system"] }
# daemon self-logging (~/.pam/log/daemon.log): all three are pure Rust.
# tracing-subscriber kept minimal — fmt for the file format, env-filter so
# PAM_LOG can raise verbosity (regex engine is regex-automata, pure Rust).
tracing = "0.1"
tracing-subscriber = { version = "0.3", default-features = false, features = ["fmt", "env-filter"] }
tracing-appender = "0.2"
# desktop shell for `pam gui`. Default features off: `compression` (brotli
# for embedded assets) and `dbus`/tray extras are not needed for the
# scaffold; `wry` is the webview runtime, `x11` keeps Linux building.
# The tauri stack is pure Rust on macOS (objc2/block2 are Rust bindings to
# system frameworks, no C compile step); see the workspace C-residue notes.
tauri = { version = "2", default-features = false, features = ["wry", "x11"] }
tauri-build = { version = "2", default-features = false, features = ["config-json"] }

# local inference (pam_model). candle is pinned `=0.9.2` on purpose: that
# release carries `quantized_qwen3`/`quantized_qwen3_moe` and has no
# `tokenizers` dependency. candle-core >= 0.10 pulls `tokenizers` with the
# `onig` feature (Oniguruma — compiled C through `cc`), which the C-free
# rule forbids. Default features off keeps CUDA/MKL/accelerate out; pure
# Rust plus system-framework bindings.
candle-core = { version = "=0.9.2", default-features = false }
candle-nn = { version = "=0.9.2", default-features = false }
candle-transformers = { version = "=0.9.2", default-features = false }
# GGUF-embedded byte-level BPE. Default features off drops `onig` (C) and
# `esaxx_fast` (C++); `fancy-regex` is the pure-Rust backtracking engine the
# Qwen pre-tokenizer split pattern needs.
tokenizers = { version = "0.22", default-features = false, features = ["fancy-regex"] }
# model integrity: SHA-256 over downloaded and installed weights. RustCrypto,
# pure Rust (the optional `asm` C backend stays off).
sha2 = "0.10"
# hex digests for the sha256 above; pure Rust, no dependencies.
hex = "0.4"

[workspace.lints.rust]
unsafe_code = "deny"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"

[workspace]
resolver = "3"
members = [
    "crates/pam",
    "crates/pam_client",
    "crates/pam_compact",
    "crates/pam_connectors",
    "crates/pam_daemon",
    "crates/pam_flow",
    "crates/pam_gui",
    "crates/pam_model",
    "crates/pam_net",
    "crates/pam_proto",
    "crates/pam_store",
    "crates/pam_testkit",
]

[workspace.package]
version = "0.4.3"
edition = "2024"
license = "Apache-2.0"
repository = "https://github.com/ro-ag/pam"

[workspace.dependencies]
pam_client = { path = "crates/pam_client" }
pam_compact = { path = "crates/pam_compact" }
pam_connectors = { path = "crates/pam_connectors" }
pam_daemon = { path = "crates/pam_daemon" }
pam_flow = { path = "crates/pam_flow" }
pam_gui = { path = "crates/pam_gui" }
pam_model = { path = "crates/pam_model" }
pam_net = { path = "crates/pam_net" }
pam_proto = { path = "crates/pam_proto" }
pam_store = { path = "crates/pam_store" }
# test-only harness; never published (dev-dependency cycles are fine —
# path-only dev-deps are stripped at publish time).
pam_testkit = { path = "crates/pam_testkit" }

serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Real SQLite for the store: the amalgamation shipped inside libsqlite3-sys,
# compiled by `cc` and linked statically. A named exception to the no-C rule
# (owner decision 2026-10-02, issue 38: the audit and authorization spine runs
# on SQLite proper), like the Tauri/objc2 shims. Never the system library, so
# every target runs the same engine.
rusqlite = { version = "0.40.1", default-features = false, features = ["bundled", "cache", "limits"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "net", "io-util", "signal"] }
thiserror = "2"
tempfile = "3"
# pure-Rust deflate/zlib for pack preflight decoding (rust_backend ->
# miniz_oxide); never the C-backed zlib-ng/cloudflare_zlib backends.
flate2 = { version = "1.1.10", default-features = false, features = ["rust_backend"] }
# CLI surface: derive-style argument parsing. Pure Rust (clap_builder,
# anstyle, proc-macro derive) — no C compile step.
clap = { version = "4", features = ["derive"] }
# Request ids (`req_<ulid>`). Pure Rust; randomness via getrandom (syscall
# bindings, no C compile step).
ulid = "1"
# process inspection for advisory caller identity; default features off keeps
# the optional `multithread` (rayon) machinery out — only the `system`
# component (processes) is needed. Pure Rust over libc/windows-sys FFI, no C
# compile step.
sysinfo = { version = "0.39", default-features = false, features = ["system"] }
# daemon self-logging (~/.pam/log/daemon.log): all three are pure Rust.
# tracing-subscriber kept minimal — fmt for the file format, env-filter so
# PAM_LOG can raise verbosity (regex engine is regex-automata, pure Rust).
tracing = "0.1"
tracing-subscriber = { version = "0.3", default-features = false, features = ["fmt", "env-filter"] }
tracing-appender = "0.2"
# desktop shell for `pam gui`. Default features off: `compression` (brotli
# for embedded assets) and `dbus`/tray extras are not needed for the
# scaffold; `wry` is the webview runtime.
# Wry currently compiles an Objective-C exception helper on macOS. This
# conflicts with the no-C-compiler constraint; see ptrack issue 16/task 142.
# An accepted exception, as bundled SQLite is (see `rusqlite` above).
tauri = { version = "2", default-features = false, features = ["wry"] }
tauri-build = { version = "2", default-features = false, features = ["config-json"] }
# Native confirmation for the admin ops that widen what agents may do
# (`pam_gui::bridge::NativeConfirmer`): owner-approved 2026-10-03 (ptrack
# task 226). Used from Rust only; the webview is granted no `dialog:`
# permission. Default features off: `gtk3` is the Linux backend and Linux
# is not a target. rfd underneath speaks AppKit through objc2 and Win32
# through windows-sys, no C compile step. Pinned below 2.8, which needs
# tauri 2.12.
tauri-plugin-dialog = { version = ">=2.7.3, <2.8", default-features = false }

# model integrity: SHA-256 over downloaded and installed weights. RustCrypto,
# pure Rust (the optional `asm` C backend stays off).
sha2 = "0.10"
# hex digests for the sha256 above; pure Rust, no dependencies.
hex = "0.4"
# OS randomness for the Windows admin nonce: a syscall binding (ProcessPrng through
# windows-targets), pure Rust, no C compile step. Already in the tree through ulid.
getrandom = "0.3"
# YAML flow files (pam_flow). Maintained serde_yaml fork; pure Rust.
serde_yaml_ng = "0.10"
# URL parsing for connector base URLs (pam_connectors); pure Rust.
url = "2"

[workspace.lints.rust]
unsafe_code = "deny"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"

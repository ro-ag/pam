[workspace]
members = [
    "crates/pam_cli",
    "crates/pam_core",
    "crates/pam_protocol",
    "crates/pam_platform",
    "crates/pam_policy",
    "crates/pam_daemon",
    "crates/pam_gui",
    "crates/pam_store",
    "crates/pam_compact",
    "crates/pam_model",
]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
rust-version = "1.97"

[workspace.dependencies]
cap-fs-ext = "=4.0.2"
cap-std = "=4.0.2"
clap = { version = "=4.6.6", features = ["derive"] }
directories = "=6.0.0"
keyring-core = "=1.0.0"
libc = "=0.2.189"
nix = { version = "=0.28.0", features = ["fs"] }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.145"
tokio = { version = "=1.53.1", features = ["io-util", "macros", "process", "rt-multi-thread", "signal", "sync", "time"] }
toml = { version = "=1.1.4", default-features = false, features = ["parse", "serde"] }
rmp-serde = "=1.3.1"
reqwest = { version = "=0.13.4", default-features = false, features = ["rustls", "system-proxy"] }
rusqlite = { version = "=0.39.0", features = ["bundled"] }
sha2 = "=0.10.9"
uuid = { version = "=1.24.1", features = ["v4"] }
zeromq = { version = "=0.6.0", default-features = false, features = ["ipc-transport", "tcp-transport", "tokio-runtime"] }
url = "=2.5.8"

pam_cli = { path = "crates/pam_cli" }
pam_core = { path = "crates/pam_core" }
pam_protocol = { path = "crates/pam_protocol" }
pam_platform = { path = "crates/pam_platform" }
pam_policy = { path = "crates/pam_policy" }
pam_daemon = { path = "crates/pam_daemon" }
pam_gui = { path = "crates/pam_gui" }
pam_store = { path = "crates/pam_store" }
pam_compact = { path = "crates/pam_compact" }
pam_model = { path = "crates/pam_model" }

[workspace.lints.rust]
rust_2018_idioms = { level = "warn", priority = -1 }
unsafe_code = "forbid"
unused_lifetimes = "warn"
unused_qualifications = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }

[package]
name = "pam"
description = "A local lifeguard for developers and AI agents: one binary, mode by subcommand."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
pam_daemon.workspace = true
pam_proto.workspace = true
sysinfo.workspace = true
thiserror.workspace = true
# `signal` on top of the workspace features: `pam daemon` blocks on ctrl_c.
tokio = { workspace = true, features = ["signal"] }

[dev-dependencies]
tempfile.workspace = true

[lints]
workspace = true

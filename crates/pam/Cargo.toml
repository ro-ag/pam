[package]
name = "pam"
description = "A local lifeguard for developers and AI agents: one binary, mode by subcommand."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
clap.workspace = true
pam_daemon.workspace = true
pam_proto.workspace = true
serde_json.workspace = true
sysinfo.workspace = true
thiserror.workspace = true
ulid.workspace = true
zeromq.workspace = true
# `signal` on top of the workspace features: `pam daemon` blocks on ctrl_c
# (and SIGTERM on unix, for `pam daemon stop`).
tokio = { workspace = true, features = ["signal"] }

[dev-dependencies]
# The integration harness inspects the daemon's store directly.
pam_store.workspace = true
tempfile.workspace = true

[lints]
workspace = true

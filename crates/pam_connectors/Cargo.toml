[package]
name = "pam_connectors"
description = "Read-only connectors for pam (GitHub Actions, Jenkins, SonarQube, Jira, Confluence, SharePoint, AWS CLI) over an injected HTTP transport backed by system curl."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[features]
# Exposes `pam_connectors::testing` — the recording fake transport the
# daemon's flow tests drive connector steps through.
testing = []

[dependencies]
pam_flow.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
# base URL validation and request building; pure Rust.
url.workspace = true
# `process` spawns curl and the aws CLI, `io-util` bounds their output,
# `time` carries deadlines, `rt` places the child readers. No runtime
# flavor — the daemon owns task placement.
tokio = { version = "1", default-features = false, features = ["process", "io-util", "time", "rt", "sync", "macros"] }

[dev-dependencies]
# a temporary directory for the fake `aws` executable the CLI tests spawn.
tempfile.workspace = true
# `net` powers `tests/curl_origin.rs`: a throwaway HTTP/1.1 origin that real
# curl is pointed at. The runtime features drive `#[tokio::test]`.
tokio = { version = "1", default-features = false, features = ["net", "rt", "rt-multi-thread", "macros", "io-util", "time", "process", "sync"] }

# The origin test needs `CurlTransport::allow_http_for_tests`, which only
# exists outside the crate's own unit tests with the `testing` feature on.
[[test]]
name = "curl_origin"
required-features = ["testing"]

[lints]
workspace = true

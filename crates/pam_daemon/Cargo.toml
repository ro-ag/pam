[package]
name = "pam_daemon"
description = "Daemon services: transport, policy gate, queue, executor, approvals, audit."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
# deterministic log reduction behind `admin.log.compress`.
pam_compact.workspace = true
pam_model.workspace = true
pam_proto.workspace = true
pam_store.workspace = true
serde.workspace = true
serde_json.workspace = true
# host RAM for the catalog fit check; the daemon answers it so the webview
# never has to guess. Same pinned feature set the client already uses.
sysinfo.workspace = true
thiserror.workspace = true
tokio.workspace = true
# model job ids (`job_<ulid>`), the same shape as request ids.
ulid.workspace = true
tracing.workspace = true
tracing-appender.workspace = true
tracing-subscriber.workspace = true
zeromq.workspace = true
# OS-native credential store for connector secrets (`secrets.rs`); the
# per-OS backend crate below is the only one actually built on each
# target. Pure Rust — no C compile step.
keyring-core = "=1.0.0"

[target.'cfg(target_os = "macos")'.dependencies]
apple-native-keyring-store = { version = "=1.0.2", features = ["keychain"] }

[target.'cfg(target_os = "windows")'.dependencies]
windows-native-keyring-store = { version = "=1.1.0", default-features = false }

[target.'cfg(target_os = "linux")'.dependencies]
# Pure-Rust D-Bus Secret Service client; NOT the `dbus`/`libdbus-sys` crate.
zbus-secret-service-keyring-store = { version = "=1.0.1", features = ["rt-tokio-crypto-rust"] }

[dev-dependencies]
# dev-only cycle (pam_testkit depends on pam_daemon); path-only
# dev-deps are stripped at publish time.
pam_testkit.workspace = true
# the admin download op is proved end to end against pam_model own
# range-serving origin rather than a second copy of it.
pam_model = { workspace = true, features = ["testing"] }
tempfile.workspace = true
# `start_paused` tests for lease/reaper timing need the paused clock.
tokio = { workspace = true, features = ["test-util"] }

[lints]
workspace = true

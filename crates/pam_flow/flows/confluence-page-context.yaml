schema: 1
id: confluence-page-context
name: Confluence page context
description: >-
  Retrieve one explicit Confluence page as bounded context. This observation does not verify a build or revision.
inputs:
  id:
    description: explicit confluence id identifier
steps:
  - id: retrieve-context
    connector: confluence
    call: page
    with:
      id: "${inputs.id}"
    role: observe
    output: compact

schema: 1
id: pr-readiness
name: Rust PR readiness
description: >-
  A Rust-only starting point: a clean tree, an up-to-date remote, the
  commits the branch adds, and format, clippy and Rust tests. It does not
  cover frontend or other project-specific gates. For PAM itself, use
  pam-pr-readiness.
steps:
  - id: clean-tree
    run: [git, status, --porcelain=v1, --untracked-files=all, --ignore-submodules=none]
    expect_empty_output: true
    role: verify
  - id: fetch
    run: [git, fetch, --prune]
  - id: branch-commits
    run: [git, log, --oneline, origin/main..HEAD]
    needs: [fetch]
  - id: fmt
    run: [cargo, fmt, --all, --check]
    role: verify
  - id: clippy
    run: [cargo, clippy, --workspace, --all-targets, "--", "-D", warnings]
    role: verify
    output: summarize
    timeout: 20m
  - id: tests
    run: [cargo, test, --workspace]
    role: verify
    output: summarize
    timeout: 30m

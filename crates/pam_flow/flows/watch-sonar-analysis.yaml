schema: 1
id: watch-sonar-analysis
name: Watch Sonar analysis
description: >-
  Watch one explicitly selected product execution, then collect its evidence
  and verify success against a declared source repository and commit. Polling
  stops at its sampling or cumulative request budget; live compatibility and
  completion within that budget are not guaranteed.
inputs:
  repository:
    description: explicit repository; no inferred latest execution
  commit:
    description: explicit commit; no inferred latest execution
  project:
    description: explicit project; no inferred latest execution
  ce_task:
    description: explicit ce_task; no inferred latest execution
correlation:
  repository: "${inputs.repository}"
  commit: "${inputs.commit}"
steps:
  - id: watch-execution
    connector: sonarqube
    call: analysis
    with:
      project: "${inputs.project}"
      ce_task: "${inputs.ce_task}"
    watch: {}
    role: verify
    expect_status: OK
    output: compact

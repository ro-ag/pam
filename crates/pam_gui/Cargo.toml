[package]
name = "pam_gui"
description = "Desktop control center for pam: the Tauri shell behind `pam gui`."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[features]
# Embed the built frontend (frontend/dist) into the binary instead of the
# dev-server context. Off by default so a plain `cargo build` never needs
# the frontend built first; production GUI builds enable it (see lib.rs).
embed = ["tauri/custom-protocol"]

[dependencies]
pam_client.workspace = true
pam_daemon.workspace = true
pam_proto.workspace = true
serde.workspace = true
serde_json.workspace = true
tauri.workspace = true
tokio.workspace = true
zeromq.workspace = true

[dev-dependencies]
pam_testkit.workspace = true
tempfile.workspace = true

[build-dependencies]
tauri-build.workspace = true

[lints]
workspace = true

[package]
name = "pam_model"
description = "Local model layer for pam: GGUF inspection, catalog, on-disk registry, download, and the llama.cpp engine."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[features]
# Exposes `pam_model::testing` — the range-serving HTTP origin the download
# suite drives real `curl` against. The daemon's admin-op tests run a
# download end to end and need the same origin, so it ships behind a feature
# instead of being copied. `tokio/net` is what the listener needs; nothing
# else changes.
testing = ["tokio/net"]

[dependencies]
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
sha2.workspace = true
hex.workspace = true
# `process` spawns system curl for downloads and the curator's agent CLIs,
# `io-util` bounds their output and `fs` moves the finished part file off the
# async threads; `sync` and `time` carry the progress watch, its 500 ms poll
# and the curator deadline; `rt` is what `start` needs to
# spawn the transfer task and hash on a blocking thread. `macros` is only `join!`, which the curator needs
# to drain a child's stdout and stderr while its stdin is still being
# written — reading them in sequence deadlocks on a full pipe. No runtime
# flavor — the daemon owns task placement.
tokio = { version = "1", default-features = false, features = [
    "sync",
    "time",
    "rt",
    "process",
    "io-util",
    "fs",
    "macros",
    "net",
] }

# every curator invocation runs in a fresh empty directory that dies with
# the call, so this is a runtime dependency and not only a test one.
tempfile.workspace = true

[dev-dependencies]
# the download suite drives the real curl against a local range-serving
# origin (`net` for the listener), the curator and runtime tests drive async
# calls; `macros`/`rt-multi-thread`/`sync`/`time` are for the tests
# themselves. Test-only — the library still asks for no runtime flavor.
tokio = { version = "1", default-features = false, features = [
    "net",
    "macros",
    "rt-multi-thread",
    "sync",
    "time",
] }

[lints]
workspace = true

# The fake llama-server the engine supervisor tests drive; a few kilobytes
# of tokio, never part of the pam package (release builds `-p pam`).
[[bin]]
name = "pam-fake-llama-server"
path = "src/bin/fake_llama_server.rs"

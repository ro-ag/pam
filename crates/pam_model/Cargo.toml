[package]
name = "pam_model"
description = "Local model layer for pam: GGUF inspection, catalog, on-disk registry, download, and the candle runtime."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
sha2.workspace = true
hex.workspace = true
# `process` spawns system curl for downloads and the curator's agent CLIs,
# `io-util` bounds their output and `fs` moves the finished part file off the
# async threads; `sync` and `time` carry the progress watch, its 500 ms poll
# and the curator deadline; `rt` is what `start` needs to
# spawn the transfer task and hash on a blocking thread. `macros` is only `join!`, which the curator needs
# to drain a child's stdout and stderr while its stdin is still being
# written — reading them in sequence deadlocks on a full pipe. No runtime
# flavor — the daemon owns task placement.
tokio = { version = "1", default-features = false, features = [
    "sync",
    "time",
    "rt",
    "process",
    "io-util",
    "fs",
    "macros",
] }
# every curator invocation runs in a fresh empty directory that dies with
# the call, so this is a runtime dependency and not only a test one.
tempfile.workspace = true
# byte-level BPE rebuilt from GGUF metadata, so a model stays one file.
tokenizers.workspace = true
# in-process inference. Declared here so the wave-2 runtime module only has
# code to fill in; the portable CPU backend is the default everywhere.
candle-core.workspace = true
candle-nn.workspace = true
candle-transformers.workspace = true

# Metal on Apple Silicon. `objc2`/`metal` are Rust bindings to system
# frameworks, so the C-free rule holds; CUDA would need `nvcc` and is not
# shipped.
[target.'cfg(target_os = "macos")'.dependencies]
candle-core = { version = "=0.9.2", default-features = false, features = ["metal"] }
candle-nn = { version = "=0.9.2", default-features = false, features = ["metal"] }
candle-transformers = { version = "=0.9.2", default-features = false, features = ["metal"] }

[dev-dependencies]
# the download suite drives the real curl against a local range-serving
# origin (`net` for the listener) and the curator tests drive async invokes;
# `macros`/`rt-multi-thread` are for the tests themselves. Test-only — the
# library still asks for no runtime flavor.
tokio = { version = "1", default-features = false, features = [
    "net",
    "macros",
    "rt-multi-thread",
] }

[lints]
workspace = true

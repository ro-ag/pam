[package]
name = "pam_platform"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
directories.workspace = true
keyring-core.workspace = true
libc.workspace = true
pam_core.workspace = true
pam_protocol.workspace = true
reqwest.workspace = true
serde.workspace = true
sha2.workspace = true
tokio.workspace = true
toml.workspace = true
uuid.workspace = true
zeromq.workspace = true

[target.'cfg(target_os = "macos")'.dependencies]
apple-native-keyring-store = { version = "=1.0.2", features = ["keychain"] }

[target.'cfg(target_os = "windows")'.dependencies]
windows-native-keyring-store = { version = "=1.1.0", default-features = false }

[target.'cfg(target_os = "linux")'.dependencies]
zbus-secret-service-keyring-store = { version = "=1.0.1", features = ["rt-tokio-crypto-rust"] }


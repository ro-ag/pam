[package]
name = "pam_store"
description = "SQLite-backed durable state for the pam daemon."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
rusqlite.workspace = true
thiserror.workspace = true
# evidence content hashing (sha256 hex) and the compression figures the
# odometer aggregates out of `evidence.meta_json`.
sha2.workspace = true
hex.workspace = true
serde_json.workspace = true
tracing.workspace = true
# `sync`: the async mutex that owns the one connection (conn_gate.rs).
# `rt`: `spawn_blocking` — the engine's client is synchronous, so the store
# places its own blocking work, one job at a time, on the caller's runtime.
tokio = { version = "1", default-features = false, features = ["sync", "rt"] }

[dev-dependencies]
tokio.workspace = true
tempfile.workspace = true

[lints]
workspace = true

[package]
name = "pam_testkit"
description = "Shared integration-test harness: real daemon on a temp runtime dir, real zmq clients, store assertions."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[dependencies]
# `FakeTransport`: connector tests script HTTP answers instead of reaching
# a network, and the harness injects it into the daemon.
pam_connectors = { workspace = true, features = ["testing"] }
pam_daemon.workspace = true
pam_proto.workspace = true
pam_store.workspace = true
serde_json.workspace = true
tempfile.workspace = true
tokio.workspace = true
zeromq.workspace = true

[lints]
workspace = true

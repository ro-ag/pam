<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <!-- Full-bleed coral semicircle with an original lifeguard tower knocked
       out: steep high-left roof, flag, deck rail, plain legs, two-step
       stairs with a simple handrail. -->
  <mask id="tower">
    <rect width="1024" height="1024" fill="#fff"/>
    <!-- roof: steep slant, high side left, wide overhang -->
    <polygon points="296,382 648,458 648,516 296,440" fill="#000"/>
    <!-- flag pole + flag -->
    <rect x="446" y="322" width="14" height="88" fill="#000"/>
    <polygon points="460,322 460,370 536,346" fill="#000"/>
    <!-- cabin -->
    <rect x="344" y="478" width="242" height="186" fill="#000"/>
    <!-- vertical window slit -->
    <rect x="470" y="512" width="64" height="118" fill="#fff"/>
    <!-- deck bar extending right to the stairs -->
    <rect x="336" y="660" width="424" height="26" fill="#000"/>
    <!-- deck railing over the right extension -->
    <rect x="600" y="612" width="160" height="16" fill="#000"/>
    <rect x="612" y="628" width="14" height="32" fill="#000"/>
    <rect x="700" y="628" width="14" height="32" fill="#000"/>
    <!-- plain legs, no brace -->
    <rect x="368" y="686" width="58" height="94" fill="#000"/>
    <rect x="522" y="686" width="58" height="94" fill="#000"/>
    <!-- stairs: two steps, simple handrail -->
    <polygon points="712,686 782,686 782,734 852,734 852,780 712,780" fill="#000"/>
    <path d="M 752 636 L 880 722" stroke="#000" stroke-width="18" stroke-linecap="round" fill="none"/>
  </mask>
  <path fill="#FC6349" mask="url(#tower)" d="M 42 780 A 470 470 0 0 1 982 780 Z"/>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <!-- Whole icon = one coral semicircle; big lifeguard tower knocked out.
       Asymmetric (tower left, ramp right, vertical slit) to avoid torii reading. -->
  <mask id="tower">
    <rect width="1024" height="1024" fill="#fff"/>
    <!-- roof -->
    <rect x="304" y="384" width="332" height="66" rx="16" fill="#000"/>
    <!-- cabin -->
    <rect x="344" y="450" width="252" height="212" fill="#000"/>
    <!-- vertical window slit, off-center -->
    <rect x="474" y="492" width="72" height="132" fill="#fff"/>
    <!-- legs -->
    <rect x="366" y="662" width="64" height="118" fill="#000"/>
    <rect x="508" y="662" width="64" height="118" fill="#000"/>
    <!-- ramp -->
    <path d="M 618 654 L 872 728" stroke="#000" stroke-width="80" stroke-linecap="round" fill="none"/>
  </mask>
  <path fill="#FC6349" mask="url(#tower)" d="M 42 780 A 470 470 0 0 1 982 780 Z"/>
</svg>

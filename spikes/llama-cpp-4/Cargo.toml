[package]
name = "pam-llama-cpp-4-spike"
version = "0.1.0"
edition = "2024"
rust-version = "1.97"
license = "Apache-2.0"
publish = false

# Keep this benchmark isolated from PAM's production workspace and dependencies.
[workspace]

[dependencies]
llama-cpp-4 = { version = "=0.6.0", default-features = false, features = ["metal"] }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.145"

[lints.rust]
rust_2018_idioms = { level = "warn", priority = -1 }
unsafe_code = "forbid"
unused_lifetimes = "warn"
unused_qualifications = "warn"

[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }

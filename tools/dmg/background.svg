<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 420" width="660" height="420">
  <!-- Pam disk-image backdrop, 660x420pt (the Finder window is fixed to this size).
       Palette from frontend/src/styles.css: coral #ff674f, coral-soft #ff9c77,
       night #06090d, surface #131a22, line #2a3542, paper #f6f3ec.
       Dusk over the Pacific: the sky darkens upward, a lit horizon band runs
       across y=317..338 (exactly where Finder paints the two icon labels, so
       they stay legible whether the viewer's Mac draws them white or black).
       The sun sets on that horizon between the two icons, and the coral
       arrow crossing above it says which way to drag. Everything in the
       middle stays light so the app's own coral mark keeps the eye.
       Wordmark and caption are Futura Medium converted to outlines, so this
       file renders identically anywhere with no font installed. -->
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="420" gradientUnits="userSpaceOnUse">
      <stop offset="0.00" stop-color="#04070b"/>
      <stop offset="0.28" stop-color="#071019"/>
      <stop offset="0.46" stop-color="#0e1a27"/>
      <stop offset="0.58" stop-color="#182131"/>
      <stop offset="0.65" stop-color="#29283a"/>
      <stop offset="0.70" stop-color="#4a3b40"/>
      <stop offset="0.745" stop-color="#7f5440"/>
      <stop offset="0.775" stop-color="#a56a4e"/>
      <stop offset="0.815" stop-color="#a06549"/>
      <stop offset="0.86" stop-color="#6e4736"/>
      <stop offset="0.92" stop-color="#3a2823"/>
      <stop offset="0.97" stop-color="#1d1512"/>
      <stop offset="1.00" stop-color="#140e12"/>
    </linearGradient>
    <radialGradient id="bloom" cx="330" cy="330" r="330" gradientUnits="userSpaceOnUse"
                    gradientTransform="matrix(1 0 0 0.46 0 178.2)">
      <stop offset="0" stop-color="#ff674f" stop-opacity="0.30"/>
      <stop offset="0.55" stop-color="#ff674f" stop-opacity="0.10"/>
      <stop offset="1" stop-color="#ff674f" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="wake" cx="330" cy="344" r="86" gradientUnits="userSpaceOnUse"
                    gradientTransform="matrix(0.62 0 0 1 125.4 0)">
      <stop offset="0" stop-color="#ff9c77" stop-opacity="0.34"/>
      <stop offset="1" stop-color="#ff9c77" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="drag" x1="280" y1="0" x2="380" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ff9c77"/>
      <stop offset="1" stop-color="#ff674f"/>
    </linearGradient>
    <radialGradient id="dragGlow" cx="330" cy="250" r="96" gradientUnits="userSpaceOnUse"
                    gradientTransform="matrix(1 0 0 0.38 0 155)">
      <stop offset="0" stop-color="#ff674f" stop-opacity="0.26"/>
      <stop offset="1" stop-color="#ff674f" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="vignette" cx="330" cy="215" r="430" gradientUnits="userSpaceOnUse"
                    gradientTransform="matrix(1 0 0 0.72 0 60.2)">
      <stop offset="0.60" stop-color="#020407" stop-opacity="0"/>
      <stop offset="1" stop-color="#020407" stop-opacity="0.55"/>
    </radialGradient>
  </defs>
  <rect width="660" height="420" fill="url(#sky)"/>
  <rect width="660" height="420" fill="url(#bloom)"/>
  <rect y="326" width="660" height="94" fill="url(#wake)"/>
  <rect width="660" height="420" fill="url(#dragGlow)"/>
  <g fill="none" stroke="url(#drag)" stroke-width="10" stroke-linecap="round" stroke-linejoin="round">
    <path d="M280 250H370"/>
    <path d="M354 232L378 250L354 268"/>
  </g>
  <rect width="660" height="420" fill="url(#vignette)"/>

[package]
edition = "2021"
rust-version = "1.85.0"
name = "zeromq"
version = "0.6.0"
authors = [
    "Alexei Kornienko <alexei.kornienko@gmail.com>",
    "Ryan Butler <thebutlah@gmail.com>",
    "Kyle Kelley <rgbkrk@gmail.com>",
]
build = false
autolib = false
autobins = false
autoexamples = false
autotests = false
autobenches = false
description = "A native Rust implementation of ZeroMQ"
readme = "README.md"
license = "MIT"
repository = "https://github.com/zeromq/zmq.rs"

[features]
all-transport = [
    "ipc-transport",
    "tcp-transport",
]
async-dispatcher-macros = ["async-dispatcher/macros"]
async-dispatcher-runtime = [
    "async-std",
    "async-dispatcher",
]
async-std-runtime = ["async-std"]
default = [
    "tokio-runtime",
    "all-transport",
]
ipc-transport = ["dep:win_uds"]
tcp-transport = []
tokio-runtime = [
    "tokio",
    "tokio-util",
]

[lib]
name = "zeromq"
path = "src/lib.rs"
bench = false







































